<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
</head>
<body>
  <form class="homey-form">
    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend">MOVAhome region</legend>
      <div class="homey-form-group">
        <label class="homey-form-label" for="region">Cloud region of your MOVAhome account</label>
        <select class="homey-form-select" id="region">
          <option value="eu" selected>Europe (EU)</option>
          <option value="us">United States (US)</option>
          <option value="cn">China (CN)</option>
          <option value="sg">Singapore / Asia (SG)</option>
          <option value="ru">Russia (RU)</option>
        </select>
      </div>
    </fieldset>
    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend">MOVAhome account</legend>
      <p class="homey-form-label"><strong>Set a password in the official MOVAhome app first.</strong> Homey only accepts email and password — not a verification code from mova.tech. If you signed up with Apple ID, open MOVAhome → account → Forgot password / Set password, then enter that email and password here.</p>
      <div class="homey-form-group">
        <label class="homey-form-label" for="username">Email or username</label>
        <input class="homey-form-input" type="text" id="username" placeholder="you@example.com" inputmode="email" autocomplete="username" />
      </div>
      <div class="homey-form-group">
        <label class="homey-form-label" for="password">Password</label>
        <input class="homey-form-input" type="password" id="password" placeholder="Password" autocomplete="current-password" />
      </div>
    </fieldset>
    <button class="homey-button-primary-full" id="submit" type="button">Log in</button>
  </form>
  <script>
    var btn = document.getElementById('submit');

    btn.addEventListener('click', function () {
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var region = document.getElementById('region').value;

      if (!username || !password) {
        Homey.alert('Enter your MOVAhome email, password, and region. Set a password in the MOVAhome app first if you used Apple ID.');
        return;
      }

      btn.classList.add('is-loading');
      btn.disabled = true;

      Homey.emit('login', { username: username, password: password, region: region })
        .then(function () {
          Homey.showView('list_devices');
        })
        .catch(function (err) {
          btn.classList.remove('is-loading');
          btn.disabled = false;
          Homey.alert((err && err.message) || 'Login failed');
        });
    });
  </script>
</body>
</html>
